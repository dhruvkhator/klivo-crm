# KLIVO: builds the Docker image our server runs (Frappe v16 + this repo's CRM branch).
# Official ghcr.io/frappe/crm images after v1.67.0 ship without the CRM app, so we build our own.
name: KLIVO image
on:
  workflow_dispatch:
  push:
    branches: ["klivo-*"]
    paths-ignore: ["mcp/**", "KLIVO.md"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/klivo-crm-app
  TAG: v16.3.0-klivo1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=${{ github.workspace }}/.github/klivo/apps.json

      - name: Verify CRM app is in the image
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE }}:${{ env.TAG }} -c \
            'cd /home/frappe/frappe-bench && ls apps && test -d apps/crm/crm && test -d assets/crm && grep -m1 __version__ apps/frappe/frappe/__init__.py'

      - name: Push
        run: docker push ${{ env.IMAGE }}:${{ env.TAG }}
